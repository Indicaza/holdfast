name: Production monitor

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      expected_release:
        description: Optional deployed commit SHA to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  smoke:
    name: Read-only production journeys
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install browser harness
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Determine the expected deployed release after a 30-minute deploy grace period
        id: release
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const commit = await github.rest.repos.getCommit({ ...context.repo, ref: 'main' });
            const runs = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', head_sha: commit.data.sha, per_page: 1 });
            const run = runs.data.workflow_runs[0];
            if (run?.conclusion === 'success' && Date.now() - Date.parse(run.updated_at) > 30 * 60 * 1000) return commit.data.sha;
            return '';
      - name: Check health, backup freshness, access boundaries, and public rendering
        working-directory: e2e
        env:
          PRODUCTION_URL: ${{ vars.HOLDFAST_PRODUCTION_URL || 'https://holdfast-tddi.onrender.com' }}
          EXPECTED_RELEASE: ${{ inputs.expected_release || steps.release.outputs.result }}
          REQUIRE_OFFSITE_BACKUP: ${{ vars.HOLDFAST_REQUIRE_OFFSITE_BACKUP || 'false' }}
        run: node scripts/productionSmoke.mjs
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-failure
          path: e2e/production-smoke-failure.png
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report or resolve production incident
    needs: smoke
    if: always() && (needs.smoke.result == 'success' || needs.smoke.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          MONITOR_RESULT: ${{ needs.smoke.result }}
        with:
          script: |
            const title = '[Guardrails] Production monitor failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100 });
            const incident = issues.find(issue => !issue.pull_request && issue.title === title);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (process.env.MONITOR_RESULT === 'success') {
              if (incident) await github.rest.issues.update({ ...context.repo, issue_number: incident.number, state: 'closed', state_reason: 'completed' });
              return;
            }
            const body = `The read-only production smoke failed. Inspect the failed step and browser evidence before changing production.\n\nLatest run: ${url}\n\nChecks cover business readiness, expected release after the deploy grace period, enabled backup freshness, private API access, and public page rendering.`;
            if (incident) await github.rest.issues.update({ ...context.repo, issue_number: incident.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
