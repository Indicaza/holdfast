name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check
        working-directory: backend
        run: npm run lint

      - name: Validate Discord manifest
        working-directory: backend
        run: npm run discord:validate

      - name: Validate Render Blueprint
        working-directory: backend
        run: npm run render:validate

      - name: Test
        working-directory: backend
        run: npm run test:coverage

      - name: Verify critical safety assertions catch broken guards
        working-directory: backend
        run: npm run test:safety-mutations

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/backend.lcov
          if-no-files-found: error
          retention-days: 7

      - name: Database disaster safety gate
        working-directory: backend
        run: npm run test:db-safety

      - name: Enforce authentication coverage
        working-directory: backend
        run: npm run test:auth

      - name: Enforce Discord provisioning coverage
        working-directory: backend
        run: npm run test:discord

  browser-regression:
    name: Browser regression
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: http://127.0.0.1:4173
      FRONTEND_URL: http://127.0.0.1:4173
      GUILD_OWNER_DISCORD_IDS: e2e-commander
      NODE_ENV: test
      PORT: 4173
      SERVE_FRONTEND: "true"
      SESSION_SECRET: holdfast-e2e-session-secret-change-me-1234567890

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Prepare disposable guild data
        shell: bash
        run: |
          DATA_DIR="$RUNNER_TEMP/holdfast-e2e-data"
          echo "GUILD_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          cp e2e/fixtures/members.json "$DATA_DIR/members.json"
          cp e2e/fixtures/quests.json "$DATA_DIR/quests.json"

      - name: Start Holdfast
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix backend start > "$RUNNER_TEMP/holdfast-e2e-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/holdfast-e2e-server.pid"

          for attempt in {1..40}; do
            if curl --fail --silent "$E2E_BASE_URL/api/health/ready" > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Holdfast did not become ready."
          cat "$RUNNER_TEMP/holdfast-e2e-server.log"
          exit 1

      - name: Run browser journeys
        working-directory: e2e
        run: npx playwright test

      - name: Verify the production monitor against the disposable app
        working-directory: e2e
        env:
          PRODUCTION_URL: http://127.0.0.1:4173
        run: node scripts/productionSmoke.mjs

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-failure
          if-no-files-found: ignore
          retention-days: 7
          path: |
            e2e/playwright-report/
            e2e/test-results/
            ${{ runner.temp }}/holdfast-e2e-server.log

      - name: Stop Holdfast
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/holdfast-e2e-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/holdfast-e2e-server.pid")" 2>/dev/null || true
          fi

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t holdfast-ci:latest --build-arg VITE_GA_MEASUREMENT_ID=G-CI123456 .

      - name: Torture production artifact
        shell: bash
        run: bash scripts/production-artifact-smoke.sh holdfast-ci:latest

  release-gate:
    name: Release gate
    if: always()
    needs: [frontend, backend, browser-regression, production-image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require every release check to succeed
        env:
          RELEASE_CHECKS: ${{ toJSON(needs) }}
        run: node scripts/release-gate.mjs
